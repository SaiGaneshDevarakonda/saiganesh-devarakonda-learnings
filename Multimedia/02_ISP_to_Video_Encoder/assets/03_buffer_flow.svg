<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 332" width="680" height="332" role="img"><title>How a GStreamer pipeline gets DDR buffers without naming an address</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="332" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><text x="40" y="80" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">User space</text><text x="40" y="170" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Kernel</text><text x="40" y="260" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Hardware</text><line x1="40" y1="120" x2="640" y2="120" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><line x1="40" y1="210" x2="640" y2="210" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="150" y="50" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="220.0" y="69.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">v4l2src</text><text x="220.0" y="88.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">/dev/video0</text><rect x="330" y="50" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="400.0" y="69.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">dma-buf fd</text><text x="400.0" y="88.0" font-size="12" font-weight="400" text-anc