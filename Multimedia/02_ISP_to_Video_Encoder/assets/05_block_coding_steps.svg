<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 116" width="732" height="116" role="img"><title>What the encoder does to every block</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="732" height="116" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="12" y="30" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="67.0" y="49.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Block</text><text x="67.0" y="68.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">8×8 or bigger</text><line x1="122" y1="58" x2="130" y2="58" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="132" y="30" width="110" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="187.0" y="49.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">Predict</text><text x="187.0" y="68.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Intra or motion</text><line x1="242" y1="58" x2="250" y2="58" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="252" y="30" width="110" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="307.0" y="49.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="Helvetica, Arial, sans-serif">Residual</text><text x="307.0" y="68.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="Helvetica, Arial, sans-serif">Actual − predicted</text><line x1="362" y1="58" x2="370" y2="58" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="372" y="30" width="110" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="427.0" y="49.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">DCT</text><text x="427.0" y="68.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">To frequencies</text><line x1="482" y1="58" x2="490" y2="58" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="492" y="30" width="110" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="547.0" y="49.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Quantize</text><text x="547.0" y="68.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Drop small values</text><line x1="602" y1="58" x2="610" y2="58" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="612" y="30" width="110" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="667.0" y="49.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Entropy code</text><text x="667.0" y="68.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Pack into bits</text></svg>