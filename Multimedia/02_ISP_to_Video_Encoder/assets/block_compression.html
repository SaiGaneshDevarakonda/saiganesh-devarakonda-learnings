<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why frames are split into blocks</title>
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--b:rgba(0,0,0,.14);--t:#5f5e5a;--bg-neutral:#F5F4EF;--border-accent:#378ADD;--radius:8px}
body{font-family:Inter,'Segoe UI',Arial,sans-serif;color:var(--text-primary);background:#fff;margin:0;padding:18px;width:720px}
h1{font-size:18px;font-weight:500;margin:0 0 6px}
p.hint{font-size:13px;color:var(--text-secondary);margin:0 0 12px}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid rgba(0,0,0,.22);border-radius:8px;background:#fff;color:var(--text-primary);cursor:pointer}
select{font:inherit;font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid rgba(0,0,0,.22);background:#fff}
svg text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.t{font-size:14px;fill:#1f1e1d}.ts{font-size:12px;fill:#5f5e5a}.th{font-size:14px;font-weight:500;fill:#1f1e1d}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.card{background:var(--bg-neutral);border-radius:var(--radius);padding:10px 12px}
.card .l{font-size:13px;color:var(--text-secondary)}.card .v{font-size:18px;font-weight:500}
</style>
</head>
<body>
<h1>Why frames are split into blocks: predict, subtract, transform</h1>
<p class="hint">One 8×8 block from three parts of a picture. The block is predicted (here: its average, as from its neighbours), only the residual is transformed (DCT) and quantized, and only the non-zero coefficients cost real bits.</p>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--text-secondary);margin-bottom:8px">
<button id="k0" onclick="setB(0)">Flat sky</button><button id="k1" onclick="setB(1)">Balloon edge</button><button id="k2" onclick="setB(2)">Tree leaves</button>
<label style="display:flex;align-items:center;gap:6px">Quantizer <input type="range" id="q" min="2" max="40" step="1" value="10" style="width:120px"><span id="qv">10</span></label>
</div>
<div id="shot">
<div id="cap" style="font-size:14px;font-weight:500;margin:0 0 4px"></div>
<svg width="100%" viewBox="0 0 680 250" role="img"><title>Block compression steps</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="128" y="20" text-anchor="middle">Pixels</text><text class="th" x="340" y="20" text-anchor="middle">Residual</text><text class="th" x="552" y="20" text-anchor="middle">Coefficients kept</text>
<g id="g0"></g><g id="g1"></g><g id="g2"></g>
<line x1="220" y1="118" x2="248" y2="118" class="arr" marker-end="url(#arrow)"/><line x1="432" y1="118" x2="460" y2="118" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="128" y="230" text-anchor="middle">8×8 block of luma</text><text class="ts" x="340" y="230" text-anchor="middle">Pixels minus prediction</text><text class="ts" x="552" y="230" text-anchor="middle">After DCT and quantize</text>
</svg>
<div id="st" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px"></div>
</div>
<script>
const X0=[40,252,464],Y0=30,C=22,NAMES=['Flat sky','Balloon edge','Tree leaves'];let blk=0,s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
function gen(t){s=11;const p=[];for(let y=0;y<8;y++)for(let x=0;x<8;x++){let v;if(t===0)v=178+0.4*y+(r()-.5)*2;else if(t===1)v=(x+y<8?178:92)+(r()-.5)*3;else v=60+r()*110;p.push(v);}return p;}
function dct(f){const o=[];for(let v=0;v<8;v++)for(let u=0;u<8;u++){let sum=0;for(let y=0;y<8;y++)for(let x=0;x<8;x++)sum+=f[y*8+x]*Math.cos((2*x+1)*u*Math.PI/16)*Math.cos((2*y+1)*v*Math.PI/16);o.push(sum*(u?Math.sqrt(.25):Math.sqrt(.125))*(v?Math.sqrt(.25):Math.sqrt(.125)));}return o;}
function grid(id,vals,fill){let h='';vals.forEach((v,i)=>{const x=X0[id]+(i%8)*C,y=Y0+Math.floor(i/8)*C,f=fill(v);h+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" fill="${f[0]}" fill-opacity="${f[1]}" stroke="#D3D1C7" stroke-width="0.5"/>`;});document.getElementById('g'+id).innerHTML=h;}
const card=(l,v)=>`<div class="card"><div class="l">${l}</div><div class="v">${v}</div></div>`;
function setB(k){blk=k;[0,1,2].forEach(i=>document.getElementById('k'+i).style.borderColor=i===k?'var(--border-accent)':'');draw();}
function draw(){const Q=+document.getElementById('q').value;document.getElementById('qv').textContent=Q;
const p=gen(blk),m=p.reduce((a,b)=>a+b,0)/64,res=p.map(v=>v-m),co=dct(res).map(c=>Math.round(c/Q)),nz=co.filter(c=>c!==0).length;
document.getElementById('cap').textContent=NAMES[blk]+', quantizer '+Q;
grid(0,p,v=>{const g=Math.round(Math.max(0,Math.min(255,v)));return[`rgb(${g},${g},${g})`,1];});
grid(1,res,v=>[v>=0?'#D85A30':'#378ADD',Math.min(1,Math.abs(v)/50)]);
grid(2,co,v=>v===0?['none',0]:['#7F77DD',Math.min(1,.35+Math.abs(v)/8)]);
document.getElementById('st').innerHTML=card('Coefficients to send',nz+' of 64')+card('Zeros (almost free)',64-nz)+card('Prediction','Block DC from neighbours');}
document.getElementById('q').addEventListener('input',draw);setB(0);
</script>
</body>
</html>
