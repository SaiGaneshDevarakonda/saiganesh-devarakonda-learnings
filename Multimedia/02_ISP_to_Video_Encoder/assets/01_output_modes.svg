<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img"><title>Three ways the ISP output reaches the next block</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="430" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><text x="40" y="36" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">A. LIMO, normal latency</text><rect x="40" y="50" width="110" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="95.0" y="75.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">OBA</text><rect x="180" y="50" width="120" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="240.0" y="75.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">FB Write IP</text><rect x="330" y="50" width="120" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="390.0" y="75.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="Helvetica, Arial, sans-serif">DDR</text><rect x="480" y="50" width="160" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="560.0" y="66.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">VCU</text><text x="560.0" y="85.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">After frame done</text><line x1="150" y1="75" x2="178" y2="75" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="300" y1="75" x2="328" y2="75" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="450" y1="75" x2="478" y2="75" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="124" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Frame-done IRQ → Linux → dma-buf → VCU driver → mailbox → VCU MCU</text><text x="40" y="164" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">B. LIMO, low latency (Sync IP)</text><rect x="40" y="178" width="110" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="95.0" y="203.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">OBA</text><rect x="180" y="178" width="120" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="240.0" y="203.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">FB Write IP</text><rect x="330" y="178" width="120" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="390.0" y="203.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="Helvetica, Arial, sans-serif">DDR</text><rect x="480" y="178" width="160" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="560.0" y="194.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">VCU</text><text x="560.0" y="213.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Starts early</text><line x1="150" y1="203" x2="178" y2="203" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="300" y1="203" x2="328" y2="203" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="330" y="250" width="120" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="390.0" y="272.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">Sync IP</text><path d="M240 228 L240 272 L328 272" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M560 228 L560 272 L452 272" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="390" y1="250" x2="390" y2="230" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="312" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Dashed = Sync IP watches the write addresses</text><text x="470" y="312" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">VCU reads pass through Sync IP</text><text x="40" y="352" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">C. LILO (live out)</text><rect x="40" y="366" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="95.0" y="388.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">OBA</text><rect x="180" y="366" width="160" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="260.0" y="388.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="Helvetica, Arial, sans-serif">Display / next IP</text><line x1="150" y1="388" x2="178" y2="388" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><text x="370" y="392" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">AXI4-Stream only: no DDR, no Sync IP</text></svg>