<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 246" width="690" height="246" role="img"><title>Linux DRM names and their bare-metal equivalents</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="690" height="246" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><text x="20" y="30" font-size="13" font-weight="600" text-anchor="start" fill="#444441" font-family="Helvetica, Arial, sans-serif">Linux name</text><rect x="20" y="44" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="80.0" y="63.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="Helvetica, Arial, sans-serif">Picture</text><text x="80.0" y="82.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="Helvetica, Arial, sans-serif">Buffer in memory</text><rect x="170" y="44" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="230.0" y="63.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">Plane</text><text x="230.0" y="82.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Reads the picture</text><rect x="320" y="44" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="380.0" y="63.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">CRTC</text><text x="380.0" y="82.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Makes the timing</text><rect x="470" y="44" width="110" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="525.0" y="63.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">Connector</text><text x="525.0" y="82.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">The port</text><rect x="600" y="44" width="70" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="635.0" y="72.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">TV</text><line x1="140" y1="72" x2="168" y2="72" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="290" y1="72" x2="318" y2="72" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="440" y1="72" x2="468" y2="72" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="580" y1="72" x2="598" y2="72" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><text x="20" y="138" font-size="13" font-weight="600" text-anchor="start" fill="#444441" font-family="Helvetica, Arial, sans-serif">Bare-metal equivalent</text><rect x="20" y="150" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="80.0" y="175.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Frame in DDR</text><rect x="170" y="150" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="230.0" y="175.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">DMA read</text><rect x="320" y="150" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="380.0" y="175.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Video bridge</text><rect x="470" y="150" width="110" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="525.0" y="175.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">HDMI TX, HPD</text><text x="20" y="228" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">User space picks the mode; the DRM driver writes the timing into the CRTC and turns everything on together.</text><line x1="80" y1="102" x2="80" y2="148" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="230" y1="102" x2="230" y2="148" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="380" y1="102" x2="380" y2="148" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="525" y1="102" x2="525" y2="148" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/></svg>