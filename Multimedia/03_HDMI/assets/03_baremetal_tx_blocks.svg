<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="680" height="336" role="img"><title>HDMI TX path with clocks and interrupts</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="336" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="150" y="26" width="380" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="42.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">CPU (bare-metal code)</text><text x="340.0" y="61.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Programs registers, handles interrupts</text><rect x="20" y="130" width="110" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="75.0" y="149.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Video source</text><text x="75.0" y="168.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">TPG or DDR read</text><rect x="150" y="130" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="210.0" y="149.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Video bridge</text><text x="210.0" y="168.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Stream to timing</text><rect x="290" y="130" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="350.0" y="149.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">HDMI TX core</text><text x="350.0" y="168.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Encode, InfoFrames</text><rect x="430" y="130" width="100" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="480.0" y="149.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">PHY</text><text x="480.0" y="168.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">PLL, serialize</text><rect x="550" y="130" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="600.0" y="149.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Cable</text><text x="600.0" y="168.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">To the sink</text><line x1="130" y1="158" x2="148" y2="158" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="270" y1="158" x2="288" y2="158" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="410" y1="158" x2="428" y2="158" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="530" y1="158" x2="548" y2="158" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="210" y1="130" x2="210" y2="80" stroke="#7F77DD" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="350" y1="130" x2="350" y2="80" stroke="#7F77DD" stroke-width="1.6" stroke-dasharra