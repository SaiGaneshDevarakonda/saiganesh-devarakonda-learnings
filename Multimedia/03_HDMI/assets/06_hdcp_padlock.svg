<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img"><title>The padlock idea behind HDCP</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="300" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="20" y="30" width="130" height="200" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="85.0" y="121.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">Source</text><text x="85.0" y="140.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Picks a secret</text><rect x="530" y="30" width="130" height="200" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="595.0" y="121.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">TV</text><text x="595.0" y="140.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Private key stays inside</text><line x1="528" y1="90" x2="152" y2="90" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#ah)"/><text x="340" y="82" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">1. TV sends an open padlock (public key + certificate)</text><line x1="152" y1="135" x2="528" y2="135" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ah)"/><text x="340" y="127" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">2. Source locks the secret in a box with it</text><line x1="152" y1="180" x2="528" y2="180" stroke="#D85A30" stroke-width="1.6" marker-end="url(#ah)"/><text x="340" y="172" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">3. Film pixels, scrambled with the secret</text><line x1="340" y1="186" x2="340" y2="236" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="230" y="238" width="220" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="340.0" y="251.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#791F1F" font-family="Helvetica, Arial, sans-serif">Spy on the cable</text><text x="340.0" y="270.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#A32D2D" font-family="Helvetica, Arial, sans-serif">Sees all 3, opens none</text></svg>