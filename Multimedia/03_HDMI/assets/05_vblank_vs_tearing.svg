<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" height="230" role="img"><title>Flipping at vblank vs mid-scan</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="660" height="230" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><text x="150" y="28" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Flip during vblank</text><rect x="20" y="40" width="260" height="150" rx="6" fill="#1F2A36"/><rect x="150" y="40" width="40" height="150" fill="#5DCAA5"/><text x="150" y="212" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Whole frame from one buffer</text><text x="510" y="28" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Flip while the screen is being read</text><rect x="380" y="40" width="260" height="150" rx="6" fill="#1F2A36"/><rect x="450" y="40" width="40" height="80" fill="#5DCAA5"/><rect x="510" y="120" width="40" height="70" fill="#5DCAA5"/><line x1="380" y1="120" x2="640" y2="120" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="510" y="212" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Top: old frame, bottom: new frame = tear</text></svg>