<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img"><title>Blanking and the pixel clock</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="700" height="330" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="40" y="30" width="440" height="260" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><rect x="40" y="30" width="30" height="260" fill="#F5C4B3"/><rect x="40" y="30" width="440" height="14" fill="#F5C4B3"/><rect x="130" y="80" width="300" height="170" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="280" y="158" font-size="14" font-weight="600" text-anchor="middle" fill="#085041" font-family="Helvetica, Arial, sans-serif">Active area</text><text x="280" y="178" font-size="12" font-weight="400" text-anchor="middle" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">1920 × 1080 visible pixels</text><text x="55" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#712B13" font-family="Helvetica, Arial, sans-serif">HS</text><text x="100" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#444441" font-family="Helvetica, Arial, sans-serif">HBP</text><text x="455" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#444441" font-family="Helvetica, Arial, sans-serif">HFP</text><text x="280" y="40" font-size="12" font-weight="400" text-anchor="middle" fill="#712B13" font-family="Helvetica, Arial, sans-serif">VS</text><text x="280" y="66" font-size="12" font-weight="400" text-anchor="middle" fill="#444441" font-family="Helvetica, Arial, sans-serif">VBP</text><text x="280" y="274" font-size="12" font-weight="400" text-anchor="middle" fill="#444441" font-family="Helvetica, Arial, sans-serif">VFP</text><text x="500" y="50" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">1080p60 example</text><text x="500" y="78" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">H total = 1920 + 88 + 44 + 148</text><text x="500" y="96" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">= 2200 pixels per row</text><text x="500" y="124" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">V total = 1080 + 4 + 5 + 36</text><text x="500" y="142" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">= 1125 rows per frame</text><text x="500" y="170" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Pixel clock =</text><text x="500" y="188" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">H total × V total × fps</text><text x="500" y="206" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">= 2200 × 1125 × 60</text><text x="500" y="228" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">= 148.5 MHz</text><text x="40" y="314" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Coral = sync pulse, grey = porches (blanking: no visible pixels), teal = what you see</text></svg>