<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" role="img"><title>One DDC bus, three listeners in the sink</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="230" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="20" y="80" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="90.0" y="101.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">Source</text><text x="90.0" y="120.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">DDC master</text><line x1="160" y1="110" x2="300" y2="110" stroke="#D85A30" stroke-width="2.5"/><line x1="300" y1="45" x2="300" y2="185" stroke="#D85A30" stroke-width="2.5"/><line x1="300" y1="45" x2="400" y2="45" stroke="#D85A30" stroke-width="2"/><line x1="300" y1="115" x2="400" y2="115" stroke="#D85A30" stroke-width="2"/><line x1="300" y1="185" x2="400" y2="185" stroke="#D85A30" stroke-width="2"/><text x="230" y="100" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">DDC = I2C in the cable</text><rect x="400" y="20" width="250" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="525.0" y="36.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">EDID  (0x50)</text><text x="525.0" y="55.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Read only: "what I sup