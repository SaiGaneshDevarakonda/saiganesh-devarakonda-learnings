<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 278" width="798" height="278" role="img"><title>ISP pipeline overview</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="798" height="278" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><text x="30" y="24" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Raw Bayer in</text><rect x="30" y="38" width="168" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="114.0" y="58.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Clean-up</text><text x="114.0" y="78.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Black, bad pixels, shading</text><line x1="201" y1="68" x2="216" y2="68" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="220" y="38" width="168" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="304.0" y="58.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Demosaic</text><text x="304.0" y="78.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Fill missing colours</text><line x1="391" y1="68" x2="406" y2="68" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="410" y="38" width="168" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="494.0" y="58.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">White balance</text><text x="494.0" y="78.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">White looks white</text><line x1="581" y1="68" x2="596" y2="68" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="600" y="38" width="168" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="684.0" y="58.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Colour correction</text><text x="684.0" y="78.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">True colours</text><path d="M684.0 101 L684.0 120 L114.0 120 L114.0 134" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="142" width="168" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="114.0" y="162.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Gamma</text><text x="114.0" y="182.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Brightness for eyes</text><line x1="201" y1="172" x2="216" y2="172" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="220" y="142" width="168" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="304.0" y="162.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Denoise, sharpen</text><text x="304.0" y="182.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Less grain, crisp edges</text><line x1="391" y1="172" x2="406" y2="172" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="410" y="142" width="168" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="494.0" y="162.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">RGB to YUV</text><text x="494.0" y="182.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Split colour, brightness</text><line x1="581" y1="172" x2="596" y2="172" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="600" y="142" width="168" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="684.0" y="162.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">4:2:0 and NV12</text><text x="684.0" y="182.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Share colour, store</text><text x="768" y="222" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">NV12 out</text><rect x="30" y="246" width="14" height="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="52" y="253" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Bayer: one colour per pixel</text><rect x="250" y="246" width="14" height="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="272" y="253" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">RGB: three colours per pixel</text><rect x="480" y="246" width="14" height="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="502" y="253" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">YUV: brightness plus colour</text></svg>
