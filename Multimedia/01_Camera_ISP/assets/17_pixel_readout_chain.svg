<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 284" width="732" height="284" role="img"><title>From photodiode to digital code</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="732" height="284" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="20" y="20" width="692" height="112" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text x="32" y="38" font-size="13" font-weight="600" text-anchor="start" fill="#444441" font-family="Helvetica, Arial, sans-serif">Inside the pixel: photodiode + 4 transistors (4T)</text><rect x="36" y="60" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="106.0" y="79.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="Helvetica, Arial, sans-serif">Photodiode</text><text x="106.0" y="98.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="Helvetica, Arial, sans-serif">Collects electrons</text><rect x="206" y="60" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="276.0" y="79.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">TX gate</text><text x="276.0" y="98.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Moves the charge</text><rect x="376" y="60" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="446.0" y="79.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">FD + RST</text><text x="446.0" y="98.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Charge to voltage</text><rect x="546" y="60" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="621.0" y="79.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">SF + SEL</text><text x="621.0" y="98.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Drives column line</text><line x1="176" y1="88" x2="204" y2="88" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="346" y1="88" x2="374" y2="88" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="516" y1="88" x2="544" y2="88" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="152" width="692" height="112" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text x="700" y="170" font-size="13" font-weight="600" text-anchor="end" fill="#444441" font-family="Helvetica, Arial, sans-serif">In every column, shared by all rows</text><rect x="36" y="192" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="111.0" y="211.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">CDS</text><text x="111.0" y="230.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Reset minus signal</text><rect x="216" y="192" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="296.0" y="211.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">Ramp ADC</text><text x="296.0" y="230.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Count until crossing</text><rect x="406" y="192" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="476.0" y="211.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Digital code</text><text x="476.0" y="230.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">RAW10 / RAW12</text><rect x="576" y="192" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="636.0" y="211.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">MIPI TX</text><text x="636.0" y="230.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">To the SoC</text><path d="M621 116 L621 142 L111 142 L111 190" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="186" y1="220" x2="214" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="376" y1="220" x2="404" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="546" y1="220" x2="574" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/></svg>