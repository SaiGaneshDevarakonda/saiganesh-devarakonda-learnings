<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISP simulator: switch each stage on and off</title>
<style>
  body { font-family: Helvetica, Arial, sans-serif; color: #2C2C2A; background: #FFFFFF; margin: 24px; line-height: 1.5; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; color: #5F5E5A; font-size: 14px; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  canvas { width: 100%; max-width: 480px; border: 1px solid #D3D1C7; border-radius: 8px; image-rendering: pixelated; }
  .stages { display: flex; flex-direction: column; gap: 8px; font-size: 15px; min-width: 240px; }
  .stages label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  button { margin-top: 8px; padding: 7px 14px; font-size: 14px; border: 1px solid #888780; border-radius: 8px; background: #F1EFE8; color: #2C2C2A; cursor: pointer; }
  #hint { margin-top: 14px; font-size: 14px; color: #0F6E56; min-height: 22px; max-width: 760px; }
</style>
</head>
<body>
<h1>ISP simulator</h1>
<p class="lead">A small scene is captured by a simulated sensor (noisy, tinted, dark corners, a few stuck pixels) and then processed by eight ISP stages. Untick a stage to see the picture without it.</p>
<div class="wrap">
  <canvas id="cv" width="480" height="320"></canvas>
  <div class="stages" id="tg"></div>
</div>
<div id="hint">All stages on: this is the final image.</div>
<script>
var W = 120, H = 80, BL = 0.06, CAST = [0.55, 1, 0.7];
var ST = [
  ["dpc", "Defective pixel correction", "Without it: white dots from stuck pixels."],
  ["blc", "Black level correction", "Without it: blacks turn grey and get a colour tint."],
  ["lsc", "Lens shading correction", "Without it: the corners are dark."],
  ["awb", "White balance", "Without it: the whole image has a colour cast."],
  ["dem", "Demosaic", "Without it: you see the raw one-colour-per-pixel mosaic."],
  ["nr",  "Noise reduction", "Without it: the image is grainy."],
  ["ccm", "Colour correction", "Without it: colours look dull and washed out."],
  ["gam", "Gamma", "Without it: the image is far too dark."]
];
var on = {};
function ch(x, y) { return y % 2 == 0 ? (x % 2 == 0 ? 0 : 1) : (x % 2 == 0 ? 1 : 2); }
function vig(x, y) { var dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2); return 1 - 0.3 * (dx * dx + dy * dy); }
function scene(x, y) {
  var dx = x - 95, dy = y - 18;
  if (dx * dx + dy * dy < 64) return [1, 0.85, 0.3];
  if (x >= 34 && x < 40 && y >= 48 && y < 60) return [0.3, 0.2, 0.1];
  if (x >= 25 && x < 50 && y >= 35 && y < 60) return [0.8, 0.2, 0.15];
  if (y < 50) return [0.35 + y * 0.004, 0.6 + y * 0.003, 0.95];
  return [0.25, 0.6, 0.2];
}
var sd = 7;
function rnd() { sd = (sd * 1103515245 + 12345) & 0x7fffffff; return sd / 0x7fffffff; }
var raw = new Float32Array(W * H);
for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
  var c = scene(x, y).map(function (v) { return Math.pow(v, 2.2); });
  var m = (c[0] + c[1] + c[2]) / 3;
  c = c.map(function (v, k) { return (m + (v - m) * 0.6) * CAST[k] * vig(x, y); });
  raw[y * W + x] = c[ch(x, y)] + (rnd() - 0.5) * 0.05 + BL;
}
for (var k = 0; k < 16; k++) raw[Math.floor(rnd() * W * H)] = 1;
function run() {
  var a = Float32Array.from(raw), x, y, i;
  if (on.dpc) {
    var b = Float32Array.from(a);
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      var n = [];
      if (x > 1) n.push(a[y * W + x - 2]);
      if (x < W - 2) n.push(a[y * W + x + 2]);
      if (y > 1) n.push(a[(y - 2) * W + x]);
      if (y < H - 2) n.push(a[(y + 2) * W + x]);
      var mx = Math.max.apply(null, n), av = n.reduce(function (p, q) { return p + q; }, 0) / n.length;
      if (a[y * W + x] > mx + 0.12) b[y * W + x] = av;
    }
    a = b;
  }
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    i = y * W + x;
    if (on.blc) a[i] -= BL;
    if (on.lsc) a[i] /= vig(x, y);
    if (on.awb) a[i] /= CAST[ch(x, y)];
  }
  var rgb = new Float32Array(W * H * 3);
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    i = y * W + x;
    if (!on.dem) { rgb[i * 3 + ch(x, y)] = a[i]; continue; }
    for (var c = 0; c < 3; c++) {
      var s = 0, cn = 0;
      for (var yy = y - 1; yy <= y + 1; yy++) for (var xx = x - 1; xx <= x + 1; xx++) {
        if (xx < 0 || yy < 0 || xx >= W || yy >= H || ch(xx, yy) != c) continue;
        s += a[yy * W + xx]; cn++;
      }
      rgb[i * 3 + c] = s / cn;
    }
  }
  if (on.nr) {
    var r2 = new Float32Array(rgb.length);
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) for (var c2 = 0; c2 < 3; c2++) {
      var s2 = 0, cn2 = 0;
      for (var y2 = y - 1; y2 <= y + 1; y2++) for (var x2 = x - 1; x2 <= x + 1; x2++) {
        if (x2 < 0 || y2 < 0 || x2 >= W || y2 >= H) continue;
        s2 += rgb[(y2 * W + x2) * 3 + c2]; cn2++;
      }
      r2[(y * W + x) * 3 + c2] = s2 / cn2;
    }
    rgb = r2;
  }
  var off = document.createElement("canvas"); off.width = W; off.height = H;
  var oc = off.getContext("2d"), im = oc.createImageData(W, H);
  for (i = 0; i < W * H; i++) {
    var p = [rgb[i * 3], rgb[i * 3 + 1], rgb[i * 3 + 2]];
    if (on.ccm) { var mm = (p[0] + p[1] + p[2]) / 3; p = p.map(function (v) { return mm + (v - mm) / 0.6; }); }
    for (var c3 = 0; c3 < 3; c3++) {
      var v = Math.max(0, Math.min(1, p[c3]));
      if (on.gam) v = Math.pow(v, 1 / 2.2);
      im.data[i * 4 + c3] = v * 255;
    }
    im.data[i * 4 + 3] = 255;
  }
  oc.putImageData(im, 0, 0);
  var ctx = document.getElementById("cv").getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, 480, 320);
  var offs = ST.filter(function (s) { return !on[s[0]]; });
  document.getElementById("hint").textContent =
    offs.length == 0 ? "All stages on: this is the final image." :
    offs.length == ST.length ? "All stages off: this is what the sensor really sends." :
    offs.map(function (s) { return s[2]; }).join(" ");
}
var tg = document.getElementById("tg");
ST.forEach(function (s) {
  on[s[0]] = true;
  var l = document.createElement("label");
  var c = document.createElement("input"); c.type = "checkbox"; c.checked = true;
  c.onchange = function () { on[s[0]] = c.checked; run(); };
  l.appendChild(c); l.appendChild(document.createTextNode(s[1])); tg.appendChild(l);
});
var bt = document.createElement("button"); bt.textContent = "All off / all on";
bt.onclick = function () {
  var any = ST.some(function (s) { return on[s[0]]; });
  ST.forEach(function (s) { on[s[0]] = !any; });
  tg.querySelectorAll("input").forEach(function (c) { c.checked = !any; });
  run();
};
tg.appendChild(bt);
run();
</script>
</body>
</html>
