<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 164" width="736" height="164" role="img"><title>From photodiodes to the ISP</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="736" height="164" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="20" y="24" width="348" height="118" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/><text x="32" y="42" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Sensor chip</text><rect x="542" y="24" width="174" height="118" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/><text x="554" y="42" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">SoC (main chip)</text><rect x="30" y="62" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Photodiodes</text><text x="105.0" y="102.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Buckets fill up</text><line x1="183" y1="92.0" x2="200" y2="92.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="204" y="62" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="279.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Converter (ADC)</text><text x="279.0" y="102.0" fo