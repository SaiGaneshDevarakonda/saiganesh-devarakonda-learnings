<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" role="img"><title>Side view of one sensor pixel</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="720" height="292" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><text x="230" y="22" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Light</text><line x1="230" y1="32" x2="230" y2="56" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><path d="M130 100 Q230 34 330 100 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><rect x="130" y="100" width="200" height="26" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><rect x="130" y="126" width="200" height="32" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/><rect x="136" y="135" width="34" height="13" fill="#5F5E5A"/><rect x="290" y="135" width="34" height="13" fill="#5F5E5A"/><rect x="130" y="158" width="200" height="112" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/><rect x="170" y="166" width="120" height="62" rx="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/><circle cx="192" cy="186" r="4.5" fill="#26215C"/><circle cx="220" cy="206" r="4.5" fill="#26215C"/><circle cx="242" cy="184" r="4.5" fill="#26215C"/><circle cx="266" cy="208" r="4.5" fill="#26215C"/><circle cx="200" cy="214" r="4.5" fill="#26215C"/><line x1="304" y1="84" x2="378" y2="78" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/><text x="386" y="78" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Microlens: focuses light into the pixel</text><line x1="330" y1="113" x2="378" y2="113" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/><text x="386" y="113" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Colour filter: passes one colour (red here)</text><line x1="324" y1="142" x2="378" y2="146" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/><text x="386" y="146" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Metal wires at the edges carry the signal out</text><line x1="290" y1="196" x2="378" y2="192" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/><text x="386" y="192" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Photodiode: light frees electrons, they collect here</text><line x1="330" y1="252" x2="378" y2="252" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/><text x="386" y="252" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Silicon body</text></svg>
