<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel readout and ramp ADC</title>
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--b:rgba(0,0,0,.14);--t:#5f5e5a;--bg-neutral:#F5F4EF;--border-accent:#378ADD;--radius:8px}
body{font-family:Inter,'Segoe UI',Arial,sans-serif;color:var(--text-primary);background:#fff;margin:0;padding:18px;width:720px}
h1{font-size:18px;font-weight:500;margin:0 0 6px}
p.hint{font-size:13px;color:var(--text-secondary);margin:0 0 12px}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid rgba(0,0,0,.22);border-radius:8px;background:#fff;color:var(--text-primary);cursor:pointer}
select{font:inherit;font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid rgba(0,0,0,.22);background:#fff}
svg text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.t{font-size:14px;fill:#1f1e1d}.ts{font-size:12px;fill:#5f5e5a}.th{font-size:14px;font-weight:500;fill:#1f1e1d}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.card{background:var(--bg-neutral);border-radius:var(--radius);padding:10px 12px}
.card .l{font-size:13px;color:var(--text-secondary)}.card .v{font-size:18px;font-weight:500}
</style>
</head>
<body>
<h1>From light to a number: photodiode, CDS and the ramp ADC</h1>
<p class="hint">Move the light and exposure sliders, pick a colour filter, then press Read out.</p>
<svg width="100%" viewBox="0 0 680 300" role="img"><title>Pixel and ramp ADC</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g stroke="#EF9F27" stroke-width="2" stroke-linecap="round"><line x1="90" y1="8" x2="94" y2="32"/><line x1="110" y1="8" x2="110" y2="32"/><line x1="130" y1="8" x2="126" y2="32"/></g>
<ellipse cx="110" cy="44" rx="48" ry="10" fill="none" stroke="#5f5e5a" stroke-width="0.8"/>
<rect id="flt" x="62" y="58" width="96" height="16" rx="2" fill="#639922" opacity="0.85"/>
<text class="ts" x="172" y="48">Microlens</text>
<text class="ts" x="172" y="70" id="fltTxt">Green filter (Bayer)</text>
<rect x="70" y="84" width="80" height="130" rx="4" fill="none" stroke="#5f5e5a" stroke-width="1"/>
<rect id="well" x="71" y="213" width="78" height="0" fill="#378ADD" opacity="0.6"/>
<rect x="150" y="190" width="26" height="14" rx="2" fill="none" stroke="#5f5e5a" stroke-width="0.8"/>
<circle cx="196" cy="197" r="8" fill="none" stroke="#5f5e5a" stroke-width="0.8"/>
<text class="ts" x="163" y="224" text-anchor="middle">TX</text>
<text class="ts" x="196" y="224" text-anchor="middle">FD</text>
<line x1="205" y1="197" x2="392" y2="197" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="300" y="186" text-anchor="middle">Column line (after CDS)</text>
<text class="ts" x="110" y="238" text-anchor="middle">Photodiode well</text>
<text class="th" x="110" y="260" text-anchor="middle" id="eTxt">0 e⁻</text>
<text class="th" x="400" y="38">Single-slope ADC</text>
<rect x="400" y="50" width="240" height="150" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<line id="sig" x1="400" y1="200" x2="640" y2="200" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<line id="ramp" x1="400" y1="200" x2="400" y2="200" stroke="#7F77DD" stroke-width="2"/>
<text class="th" x="520" y="232" text-anchor="middle" id="cnt">Code: press read out</text>
<text class="ts" x="520" y="254" text-anchor="middle">Orange = pixel voltage, purple = ramp</text>
<text class="ts" x="520" y="276" text-anchor="middle" id="note"></text>
</svg>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:13px;color:var(--text-secondary);margin-top:8px">
<span>Light</span><input type="range" id="lt" min="0" max="100" step="1" value="40" style="width:120px">
<span>Exposure</span><input type="range" id="ex" min="1" max="33" step="1" value="16" style="width:120px"><span id="exv" style="min-width:42px">16 ms</span>
<button onclick="setF('R')">R</button><button onclick="setF('G')">G</button><button onclick="setF('B')">B</button>
<button onclick="readout()">Read out</button>
</div>
<script>
const FW=10000,C={R:['#E24B4A','Red filter (Bayer)'],G:['#639922','Green filter (Bayer)'],B:['#378ADD','Blue filter (Bayer)']};
let frac=0,anim=null;
const $=id=>document.getElementById(id);
function setF(k){$('flt').setAttribute('fill',C[k][0]);$('fltTxt').textContent=C[k][1];}
function upd(){
 if(anim)cancelAnimationFrame(anim);
 const e=Math.min(FW,(+$('lt').value)*(+$('ex').value)*4);frac=e/FW;
 const h=frac*128;$('well').setAttribute('height',h);$('well').setAttribute('y',213-h);
 $('exv').textContent=$('ex').value+' ms';
 $('eTxt').textContent=Math.round(e).toLocaleString('en-US')+' e⁻'+(e>=FW?' (saturated)':'');
 const y=200-frac*140;$('sig').setAttribute('y1',y);$('sig').setAttribute('y2',y);
 setRamp(0,false);$('cnt').textContent='Code: press read out';$('note').textContent='';
}
function setRamp(p,show){
 const done=p>=frac;if(done)p=frac;
 $('ramp').setAttribute('x2',400+p/1.07*240);$('ramp').setAttribute('y2',200-p*140);
 if(!show)return done;
 $('cnt').textContent='Code: '+(64+Math.round(Math.min(p,1)*4031))+(done?' (12-bit)':'');
 $('note').textContent=done?(frac>=1?'Clipped at 4095: highlight detail is lost':'Zero light still reads 64: the black level BLC removes'):'';
 return done;
}
function readout(){
 if(anim)cancelAnimationFrame(anim);
 const t0=performance.now(),D=1500;
 function step(t){if(setRamp(Math.min(1.07,(t-t0)/D*1.07),true))return;anim=requestAnimationFrame(step);}
 anim=requestAnimationFrame(step);
}
function setLight(l,x){$('lt').value=l;$('ex').value=x;upd();}
$('lt').oninput=upd;$('ex').oninput=upd;upd();
</script>
</body>
</html>
