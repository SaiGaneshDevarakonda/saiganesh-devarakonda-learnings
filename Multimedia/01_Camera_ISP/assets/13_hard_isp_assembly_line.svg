<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 244" width="750" height="244" role="img"><title>A hard ISP works like an assembly line</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="750" height="244" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="100" y="30" width="130" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="165.0" y="50.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">1. Clean</text><text x="165.0" y="70.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Fix raw faults</text><line x1="165" y1="90" x2="165" y2="128" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/><rect x="250" y="30" width="130" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="315.0" y="50.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">2. Colour</text><text x="315.0" y="70.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Demosaic to RGB</text><line x1="315" y1="90" x2="315" y2="128" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/><rect x="400" y="30" width="130" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="465.0" y="50.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">3. Look</text><text x="465.0" y="70.0" font-size="12" font-weight="400" text-ancho