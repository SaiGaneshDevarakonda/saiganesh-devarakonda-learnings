<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 362" width="700" height="362" role="img"><title>Inside the IBA and its interrupts during one frame</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="700" height="362" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="40" y="50" width="110" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="95.0" y="66.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">CSI-2 RX</text><text x="95.0" y="85.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">AXI4-Stream</text><rect x="170" y="22" width="360" height="98" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text x="182" y="40" font-size="13" font-weight="600" text-anchor="start" fill="#444441" font-family="Helvetica, Arial, sans-serif">IBA</text><rect x="185" y="52" width="105" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="237.5" y="68.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="Helvetica, Arial, sans-serif">Async FIFO</text><text x="237.5" y="87.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="Helvetica, Arial, sans-serif">Clock crossing</text><rect x="300" y="52" width="105" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="352.5" y="68.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="Helvetica, Arial, sans-serif">Format, PPC</text><text x="352.5" y="87.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="Helvetica, Arial, sans-serif">Unpack pixels</text><rect x="415" y="52" width="105" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="467.5" y="68.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="Helvetica, Arial, sans-serif">Size check</text><text x="467.5" y="87.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="Helvetica, Arial, sans-serif">W × H, sync</text><rect x="550" y="50" width="110" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="605.0" y="66.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">ISP core</text><text x="605.0" y="85.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">BLC onward</text><line x1="150" y1="76" x2="183" y2="76" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="290" y1="77" x2="298" y2="77" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="405" y1="77" x2="413" y2="77" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="520" y1="76" x2="548" y2="76" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="160" font-size="14" font-weight="600" text-anchor="start" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">One frame as the IBA sees it</text><text x="150" y="188" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Frame start</text><text x="370" y="188" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Line N</text><text x="582" y="188" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Frame end</text><line x1="150" y1="196" x2="150" y2="232" stroke="#BA7517" stroke-width="2"/><line x1="370" y1="196" x2="370" y2="232" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="582" y1="196" x2="582" y2="232" stroke="#BA7517" stroke-width="2"/><rect x="160" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="202" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="244" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="286" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="328" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="378" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="420" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="462" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="504" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><rect x="540" y="204" width="34" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="40" y="254" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">SOF: apply shadow registers,</text><text x="40" y="272" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">timestamp, start 3A</text><text x="260" y="254" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Line N: slice ready,</text><text x="260" y="272" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">low-latency sync</text><text x="470" y="254" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">EOF: frame count, fps,</text><text x="470" y="272" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">frame complete</text><rect x="40" y="292" width="620" height="50" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="350.0" y="308.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#791F1F" font-family="Helvetica, Arial, sans-serif">Error interrupts</text><text x="350.0" y="327.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#A32D2D" font-family="Helvetica, Arial, sans-serif">FIFO overflow, line or frame size mismatch, missing SOF/EOF, parity</text></svg>