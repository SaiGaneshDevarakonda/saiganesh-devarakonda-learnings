<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 150" width="732" height="150" role="img"><title>Camera chain: light, sensor, ISP, screen or encoder</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="732" height="150" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="30" y="40" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="60.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Light</text><text x="105.0" y="80.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">From the scene</text><line x1="183" y1="70.0" x2="200" y2="70.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="204" y="40" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="279.0" y="60.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Sensor</text><text x="279.0" y="80.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Light to numbers</text><line x1="357" y1="70.0" x2="374" y2="70.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="378" y="40" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="453.0" y="60.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">ISP</text><text x="453.0" y="80.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Raw to viewable</text><line x1="531" y1="70.0" x2="548" y2="70.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="552" y="40" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="627.0" y="60.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Screen or encoder</text><text x="627.0" y="80.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Uses the picture</text><text x="366" y="128" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Raw Bayer data: not viewable</text><text x="627" y="128" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Normal picture</text></svg>
