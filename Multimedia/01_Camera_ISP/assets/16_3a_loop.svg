<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" width="760" height="178" role="img"><title>The 3A feedback loop</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="760" height="178" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/><rect x="30" y="40" width="140" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="100.0" y="60.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Sensor</text><text x="100.0" y="80.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Exposure, gain</text><line x1="173" y1="70" x2="206" y2="70" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="210" y="40" width="140" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="280.0" y="60.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">ISP</text><text x="280.0" y="80.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Processes pixels</text><line x1="353" y1="70" x2="386" y2="70" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="390" y="40" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="465.0" y="60.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="Helvetica, Arial, sans-serif">Statistics</text><text x="465.0" y="80.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Brightness, colour</text><line x1="543" y1="70" x2="576" y2="70" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="580" y="40" width="150" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="655.0" y="60.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="Helvetica, Arial, sans-serif">3A firmware</text><text x="655.0" y="80.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="Helvetica, Arial, sans-serif">Decides new settings</text><path d="M655 103 L655 140 L100 140 L100 106" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><path d="M620 103 L620 124 L280 124 L280 106" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><text x="380" y="158" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">New exposure and gain go to the sensor; new white balance gains go to the ISP, for the next frame</text></svg>
