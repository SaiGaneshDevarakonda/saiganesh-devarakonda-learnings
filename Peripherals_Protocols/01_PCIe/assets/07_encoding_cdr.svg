<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 300' width='680' height='300' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#5F5E5A'/></marker></defs><rect width='680' height='300' fill='#ffffff'/><text x='20' y='26' font-size='15' text-anchor='start' fill='#2C2C2A' font-weight="600">Without encoding: a long run of zeros has no edges</text><polyline points='20,70 660,70' fill='none' stroke='#993C1D' stroke-width='3'/><line x1='40' y1='85' x2='40' y2='100' stroke='#0F6E56' stroke-width='2'/><line x1='83' y1='85' x2='83' y2='100' stroke='#0F6E56' stroke-width='2'/><line x1='126' y1='85' x2='126' y2='100' stroke='#0F6E56' stroke-width='2'/><line x1='169' y1='85' x2='169' y2='100' stroke='#0F6E56' stroke-width='2'/><line x1='212' y1='85' x2='212' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='255' y1='85' x2='255' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='298' y1='85' x2='298' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='341' y1='85' x2='341' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='384' y1='85' x2='384' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='427' y1='85' x2='427' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='470' y1='85' x2='470' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='513' y1='85' x2='513' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='556' y1='85' x2='556' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='599' y1='85' x2='599' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='642' y1='85' x2='642' y2='100' stroke='#993C1D' stroke-width='2'/><line x1='685' y1='85' x2='685' y2='100' stroke='#993C1D' stroke-width='2'/><text x='20' y='122' font-size='12' text-anchor='start' fill='#993C1D' >Receiver sampling point drifts: was it 16 zeros or 17?</text><text x='20' y='166' font-size='15' text-anchor='start' fill='#2C