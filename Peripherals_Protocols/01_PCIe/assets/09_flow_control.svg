<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 225' width='680' height='225' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#5F5E5A'/></marker></defs><rect width='680' height='225' fill='#ffffff'/><rect x='20' y='40' width='170' height='130' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='105.0' y='101.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Sender</text><text x='105.0' y='120.0' text-anchor='middle' font-size='12' fill='#534AB7'>credits available: 2</text><line x1='190' y1='85' x2='470' y2='85' stroke='#993C1D' stroke-width='2' marker-end="url(#a)"/><text x='330' y='77' font-size='12' text-anchor='middle' fill='#993C1D' >TLP (uses 1 credit)</text><line x1='470' y1='125' x2='190' y2='125' stroke='#0F6E56' stroke-width='2' marker-end="url(#a)" stroke-dasharray="6 4"/><text x='330' y='145' font-size='12' text-anchor='middle' fill='#0F6E56' >UpdateFC (credit returned)</text><rect x='470' y='30' width='190' height='150' rx='8' fill='none' stroke='#5F5E5A'/><text x='565' y='22' font-size='12' text-anchor='middle' fill='#5F5E5A' >Receiver buffer (4 slots)</text><rect x='485' y='42' width='160' height='28' rx='4' fill='#FAECE7' stroke='#B4B2A9'/><text x='565' y='61' font-size='12' text-anchor='middle' fill='#993C1D' >TLP</text><rect x='485' y='76' width='160' height='28' rx='4' fill='#FAECE7' stroke='#B4B2A9'/><text x='565' y='95' font-size='12' text-anchor='middle' fill='#993C1D' >TLP</text><rect x='485' y='110' width='160' height='28' rx='4' fill='#fff' stroke='#B4B2A9'/><rect x='485' y='144' width='160' height='28' rx='4' fill='#fff' stroke='#B4B2A9'/><text x='340' y='210' font-size='12' text-anchor='middle' fill='#5F5E5A' >Credits = free space at the receiver. At 0 credits the sender waits, so nothing overflows.</text></svg>