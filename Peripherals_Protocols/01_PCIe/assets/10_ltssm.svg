<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 235' width='680' height='235' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#5F5E5A'/></marker></defs><rect width='680' height='235' fill='#ffffff'/><rect x='10' y='40' width='150' height='60' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='85.0' y='66.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Detect</text><text x='85.0' y='85.0' text-anchor='middle' font-size='12' fill='#534AB7'>anyone there?</text><line x1='160' y1='70' x2='178' y2='70' stroke='#5F5E5A' stroke-width='2' marker-end="url(#a)"/><rect x='178' y='40' width='150' height='60' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='253.0' y='66.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Polling</text><text x='253.0' y='85.0' text-anchor='middle' font-size='12' fill='#534AB7'>bit + symbol lock</text><line x1='328' y1='70' x2='346' y2='70' stroke='#5F5E5A' stroke-width='2' marker-end="url(#a)"/><rect x='346' y='40' width='150' height='60' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='421.0' y='66.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Configuration</text><text x='421.0' y='85.0' text-anchor='middle' font-size='12' fill='#534AB7'>width, lane numbers</text><line x1='496' y1='70' x2='514' y2='70' stroke='#5F5E5A' stroke-width='2' marker-end="url(#a)"/><rect x='514' y='40' width='150' height='60' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='1.2'/><text x='589.0' y='66.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>L0</text><text x='589.0' y='85.0' text-anchor='middle' font-size='12' fill='#0F6E56'>link up</text><rect x='514' y='150' width='150' height='60' rx='8' fill='#FAECE7' stroke='#993C1D' stroke-width='1.2'/><text x='589.0' y='176.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Recovery</text><text x='589.0' y='195.0' text-anchor='middle' font-size='12' fill='#993C1D'>speed up, retrain</text><line x1='575' y1='100' x2='575' y2='150' stroke='#5F5E5A' stroke-width='2' marker-end="url(#a)"/><line x1='605' y1='150' x2='605' y2='100' stroke='#5F5E5A' stroke-width='2' marker-end="url(#a)"/><text x='20' y='175' font-size='13' text-anchor='start' fill='#2C2C2A' >Always starts at Gen1 (2.5 GT/s).</text><text x='20' y='197' font-size='13' text-anchor='start' fill='#2C2C2A' >Recovery moves to the highest common speed</text><text x='20' y='219' font-size='13' text-anchor='start' fill='#2C2C2A' >and runs equalization, then returns to L0.</text></svg>