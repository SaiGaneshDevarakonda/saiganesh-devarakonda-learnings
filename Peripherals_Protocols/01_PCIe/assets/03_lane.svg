<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 270' width='680' height='270' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#5F5E5A'/></marker></defs><rect width='680' height='270' fill='#ffffff'/><text x='20' y='28' font-size='16' text-anchor='start' fill='#2C2C2A' font-weight="600">One lane = two differential pairs = four wires</text><rect x='20' y='60' width='120' height='160' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='80.0' y='145.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Device A</text><rect x='540' y='60' width='120' height='160' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='600.0' y='145.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Device B</text><line x1='140' y1='90' x2='540' y2='90' stroke='#0F6E56' stroke-width='2'/><line x1='140' y1='102' x2='540' y2='102' stroke='#0F6E56' stroke-width='2'/><text x='340' y='80' font-size='13' text-anchor='middle' fill='#0F6E56' >TX pair (D+ / D−): A → B</text><line x1='140' y1='180' x2='540' y2='180' stroke='#993C1D' stroke-width='2'/><line x1='140' y1='192' x2='540' y2='192' stroke='#993C1D' stroke-width='2'/><text x='340' y='214' font-size='13' text-anchor='middle' fill='#993C1D' >RX pair (D+ / D−): B → A</text><rect x='200' y='122' width='280' height='40' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='1.2'/><text x='340.0' y='147.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>Clock is embedded in the data</text><text x='340' y='250' font-size='12' text-anchor='middle' fill='#5F5E5A' >Full duplex, no clock wire. Width: x1, x2, x4, x8, x16 (x16 = 64 signal wires)</text></svg>