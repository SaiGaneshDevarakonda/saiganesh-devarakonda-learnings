<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 490' width='680' height='490' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#5F5E5A'/></marker></defs><rect width='680' height='490' fill='#ffffff'/><text x='20' y='28' font-size='16' text-anchor='start' fill='#2C2C2A' font-weight="600">Old PCI: one shared parallel bus</text><rect x='20' y='60' width='100' height='60' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='70.0' y='95.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>CPU</text><rect x='120' y='86' width='540' height='8' fill='#B4B2A9'/><text x='390' y='78' font-size='12' text-anchor='middle' fill='#5F5E5A' >32 shared wires, ~133 MB/s for everyone</text><line x1='210' y1='94' x2='210' y2='140' stroke='#B4B2A9' stroke-width='3'/><rect x='160' y='140' width='100' height='40' rx='8' fill='#F1EFE8' stroke='#5F5E5A' stroke-width='1.2'/><text x='210.0' y='165.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>GPU</text><line x1='340' y1='94' x2='340' y2='140' stroke='#B4B2A9' stroke-width='3'/><rect x='290' y='140' width='100' height='40' rx='8' fill='#F1EFE8' stroke='#5F5E5A' stroke-width='1.2'/><text x='340.0' y='165.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Network</text><line x1='470' y1='94' x2='470' y2='140' stroke='#B4B2A9' stroke-width='3'/><rect x='420' y='140' width='100' height='40' rx='8' fill='#F1EFE8' stroke='#5F5E5A' stroke-width='1.2'/><text x='470.0' y='165.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Storage</text><line x1='600' y1='94' x2='600' y2='140' stroke='#B4B2A9' stroke-width='3'/><rect x='550' y='140' width='100' height='40' rx='8' fill='#F1EFE8' stroke='#5F5E5A' stroke-width='1.2'/><text x='600.0' y='165.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>Sound</text><text x='390' y='205' font-size='12' text-anchor='middle' fill='#993C1D' >Only one device can drive the wires at a time; the others wait</text><text x='20' y='250' font-size='16' text-anchor='start' fill='#2C2C2A' font-weight="600">PCIe: a private link per device</text><rect x='20' y='300' width='100' height='110' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='70.0' y='351.0' text-anchor='middle' font-size='15' font-weight='600' fill='#2C2C2A'>CPU</text><text x='70.0' y='370.0' text-anchor='middle' font-size='12' fill='#534AB7'>Root Complex</text><path d='M120 330 C330 330 330 288 540 288' fill='none' stroke='#0F6E56' stroke-width='6'/><rect x='540' y='270' width='120' height='36' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='1.2'/><text x='600.0' y='293.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>GPU x16</text><path d='M120 346 C330 346 330 334 540 334' fill='none' stroke='#0F6E56' stroke-width='4'/><rect x='540' y='316' width='120' height='36' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='1.2'/><text x='600.0' y='339.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>SSD x4</text><path d='M120 362 C330 362 330 380 540 380' fill='none' stroke='#0F6E56' stroke-width='5'/><rect x='540' y='362' width='120' height='36' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='1.2'/><text x='600.0' y='385.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>NIC x8</text><path d='M120 378 C330 378 330 426 540 426' fill='none' stroke='#0F6E56' stroke-width='2'/><rect x='540' y='408' width='120' height='36' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='1.2'/><text x='600.0' y='431.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>Wi-Fi x1</text><text x='340' y='470' font-size='12' text-anchor='middle' fill='#0F6E56' >Every device talks at the same time. More lanes means more bandwidth.</text></svg>