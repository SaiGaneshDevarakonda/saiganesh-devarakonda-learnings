<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 250' width='680' height='250' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#5F5E5A'/></marker></defs><rect width='680' height='250' fill='#ffffff'/><text x='20' y='24' font-size='15' text-anchor='start' fill='#2C2C2A' font-weight="600">Depth-first scan assigns bus numbers</text><rect x='60' y='40' width='170' height='40' rx='8' fill='#EEEDFE' stroke='#534AB7' stroke-width='1.2'/><text x='145.0' y='65.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>Root port · bus 0</text><line x1='145' y1='80' x2='145' y2='110' stroke='#5F5E5A' stroke-width='2'/><rect x='60' y='110' width='170' height='40' rx='8' fill='#FAECE7' stroke='#993C1D' stroke-width='1.2'/><text x='145.0' y='135.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>Switch · bus 1</text><line x1='110' y1='150' x2='70' y2='190' stroke='#5F5E5A' stroke-width='2'/><line x1='180' y1='150' x2='220' y2='190' stroke='#5F5E5A' stroke-width='2'/><rect x='10' y='190' width='120' height='40' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='1.2'/><text x='70.0' y='215.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>NVMe · bus 2</text><rect x='160' y='190' width='120' height='40' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='1.2'/><text x='220.0' y='215.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>NIC · bus 3</text><text x='360' y='24' font-size='15' text-anchor='start' fill='#2C2C2A' font-weight="600">BAR sizing</text><rect x='360' y='40' width='300' height='42' rx='8' fill='#F1EFE8' stroke='#5F5E5A' stroke-width='1.2'/><text x='510.0' y='57.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>1. Write all 1s</text><text x='510.0' y='76.0' text-anchor='middle' font-size='12' fill='#5F5E5A'>0xFFFFFFFF</text><rect x='360' y='90' width='300' height='42' rx='8' fill='#F1EFE8' stroke='#5F5E5A' stroke-width='1.2'/><text x='510.0' y='107.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>2. Read back</text><text x='510.0' y='126.0' text-anchor='middle' font-size='12' fill='#5F5E5A'>0xFFFF0000</text><rect x='360' y='140' width='300' height='42' rx='8' fill='#F1EFE8' stroke='#5F5E5A' stroke-width='1.2'/><text x='510.0' y='157.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>3. 16 zero bits</text><text x='510.0' y='176.0' text-anchor='middle' font-size='12' fill='#5F5E5A'>size = 64 KB</text><rect x='360' y='190' width='300' height='42' rx='8' fill='#F1EFE8' stroke='#5F5E5A' stroke-width='1.2'/><text x='510.0' y='207.0' text-anchor='middle' font-size='13' font-weight='600' fill='#2C2C2A'>4. Write base</text><text x='510.0' y='226.0' text-anchor='middle' font-size='12' fill='#5F5E5A'>BAR0 = 0xA0000000</text></svg>